name: Nightly scrape

# 02:30 IST = 21:00 UTC the previous day. GitHub cron is always UTC.
# Note: scheduled runs on GitHub are best-effort and can start late when
# their infrastructure is busy; that is fine for a once-a-day job.
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

# Never let two scrapes overlap - two runs would hit the portal at once and
# race each other committing the data files.
concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write             # to commit the refreshed data
  pages: write                # to publish the site
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330      # a first backfill can take ~3h; normal runs ~30m
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          pip install --quiet playwright
          playwright install --with-deps chromium

      # Cheap, offline, and catches the phantom-alert class of bug before
      # it can flood a night's notifications.
      - name: Regression tests
        run: |
          python3 engine/test_no_phantoms.py
          python3 engine/store.py > /dev/null
          python3 engine/classify.py > /dev/null

      - name: Rebuild the database from the committed data
        run: python3 engine/export.py --restore

      - name: Scrape
        run: python3 engine/main.py | tee "$GITHUB_STEP_SUMMARY"

      # When the scrape fails, say WHY somewhere readable without signing
      # in. The job log requires admin rights; the run summary does not.
      - name: Diagnose a failed scrape
        if: failure()
        run: python3 engine/diagnose.py >> "$GITHUB_STEP_SUMMARY"

      - name: Write the data back out
        run: python3 engine/export.py --dump
        env:
          BUILD_ID: ${{ github.sha }}

      # Stamp the same id into the page, so it can tell whether the copy a
      # browser is holding matches what was published.
      - name: Stamp the build id into the page
        run: sed -i "s/__BUILD__/${GITHUB_SHA}/" site/index.html

      - name: Commit if anything changed
        run: |
          git config user.name  "tn-tender-bot"
          git config user.email "actions@github.com"
          git add data/tenders.ndjson data/events.ndjson
          if git diff --staged --quiet; then
            echo "No change tonight - nothing to commit."
          else
            git commit -m "Nightly scrape: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Check the page structure
        run: python3 site/check_layout.py site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

      # Notifications run LAST and can never fail the job: by this point the
      # data is committed and the site is published, which is the part that
      # matters. A push service having a bad night must not look like a
      # broken scrape.
      - name: Notify subscribed devices
        if: always()
        continue-on-error: true
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          VAPID_SUBJECT: mailto:kim@piperocket.digital
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://tenders.rdecosolutions.org/
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] && [ -z "$NTFY_TOPIC" ]; then
            echo "No notification channel configured yet - skipping."
            exit 0
          fi
          pip install --quiet pywebpush
          # The signing key only ever exists on disk inside this run.
          printf '%s' "$VAPID_PRIVATE_KEY" > vapid_private_key.pem
          python3 engine/notify.py || true
          rm -f vapid_private_key.pem
        # notify.py writes its outcome to the run summary, so a missing
        # notification can be diagnosed without admin access to the log.
